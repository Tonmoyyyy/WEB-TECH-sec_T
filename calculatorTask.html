<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS Calculator</title>
    <style>
        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f0f2f5;
            font-family: sans-serif;
        }

        .calculator {
            background-color: #313131;
            padding: 16px; 
            border-radius: 10px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
            width: 260px; 
        }

        #display {
            width: 100%;
            height: 40px; 
            background-color: #fff;
            border: none;
            border-radius: 4px;
            margin-bottom: 15px;
            font-size: 1.2rem; 
            padding: 8px;
            box-sizing: border-box;
            outline: none;
        }

        .buttons-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px; 
        }

        button {
            height: 45px; 
            border: none;
            border-radius: 5px;
            font-size: 1rem; 
            cursor: pointer;
            background-color: #e0e0e0;
            color: #000;
            transition: 0.1s;
        }

        button:active {
            transform: scale(0.95);
            opacity: 0.9;
        }

        .red { background-color: #e74c3c; color: white; }
        .orange { background-color: #f39c12; color: white; }
        .green { background-color: #27ae60; color: white; }

        .span-2 { grid-column: span 2; }
    </style>
</head>
<body>

    <div class="calculator">
        <input type="text" id="display" readonly placeholder="0">

        <div class="buttons-grid" id="keys">
            <button class="red span-2">C</button>
            <button class="orange">/</button>
            <button class="orange">*</button>

            <button>7</button>
            <button>8</button>
            <button>9</button>
            <button class="orange">-</button>

            <button>4</button>
            <button>5</button>
            <button>6</button>
            <button class="orange">+</button>

            <button>1</button>
            <button>2</button>
            <button>3</button>
            <div style="grid-column: 4;"></div> 

            <button class="green span-2">=</button>
            <button class="span-2">0</button>

            <button>.</button>
        </div>
    </div>

    <script>
        const display = document.getElementById('display');
        const keys = document.getElementById('keys');

        keys.addEventListener('click', (e) => {
            if (e.target.tagName !== 'BUTTON') return;
            const val = e.target.textContent;

            if (val === 'C') {
                display.value = '';
            } else if (val === '=') {
                try {
                    display.value = eval(display.value) || '';
                } catch {
                    display.value = "Error";
                }
            } else {
                display.value += val;
            }
        });
    </script>
</body>
</html>
