<!DOCTYPE html>
<html>
<head>
    <title>TechFlow</title>
    <style>
        html { margin: 0; padding: 0; height: 100%; font-family: sans-serif; scroll-behavior: smooth; }

        .sidebar {
            width: 25%;
            height: 100vh;
            background-color: black;
            color: white;
            padding: 20px;
            position: fixed;
            left: 0;
            top: 0;
            box-sizing: border-box;
        }

        .brand { font-size: 24px; font-weight: bold; margin-bottom: 40px; display: block; }

        .nav-link {
            display: block;
            text-decoration: none;
            color: white;
            padding: 10px;
            margin-bottom: 10px;
            border: 1px solid white;
            text-align: center;
            transition: 0.3s;
        }

        .login-btn:hover { background-color: blue; border-color: blue; }
        .reg-btn:hover { background-color: green; border-color: green; }

        .main {
            margin-left: 25%;
            width: 75%;
            background-color: #f0f0f0;
        }

        .screen {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .form-area {
            width: 350px;
            display: flex;
            flex-direction: column;
            align-items: flex-start; 
        }

        .form-area b { font-size: 22px; margin-bottom: 20px; }
        
        label { font-weight: bold; margin-bottom: 5px; }

        input, select {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }

        .white-box {
            background-color: white;
            padding: 25px;
            width: 100%;
            box-shadow: 0px 4px 10px rgba(0,0,0,0.1);
            border-radius: 8px;
            box-sizing: border-box;
        }

        .submit {
            width: 100%;
            padding: 12px;
            border: none;
            color: white;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
        }

        .blue { background-color: blue; }
        .green { background-color: green; }
    </style>
</head>
<body>

    <div class="sidebar">
        <span class="brand">TechFlow</span>
        <a href="#login" class="nav-link login-btn">Login</a>
        <a href="#reg" class="nav-link reg-btn">Registration</a>
    </div>

    <div class="main">

        <div id="login" class="screen">
            <div class="form-area">
                <b>Login</b>
                
                <label>Email Address</label>
                <input type="text">
                
                <label>Password</label>
                <input type="password">
                
                <div class="white-box">
                    <button class="submit blue">Sign In</button>
                </div>
            </div>
        </div>

        <div id="reg" class="screen">
            <div class="form-area">
                <b>Create account</b>
                
                <label>Email Address</label>
                <input type="text">
                
                <label>Password</label>
                <input type="password">
                
                <label>Gender</label>
                <select>
                    <option>Male</option>
                    <option>Female</option>
                </select>
                
                <div class="white-box">
                    <button class="submit green">Registration</button>
                </div>
            </div>
        </div>

    </div>

</body>
</html>
